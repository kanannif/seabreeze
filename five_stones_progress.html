<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
  <title>Five Stones - Piles Installation Progress</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <style>
    /* ТОЧНО такой же стиль, как в rixos — копируй полностью из твоего файла */
    /* ... (вставь весь <style> из твоего five_stones_progress.html) ... */
  </style>
</head>
<body>

  <div id="container">
    <img id="background" src="" alt="" style="display:none;">
    <svg id="svg-overlay" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid meet"></svg>

    <div id="toolbar">
      <!-- ... (весь toolbar без изменений) ... -->
    </div>

    <div id="counter">0 / 400</div>

    <div id="mode-btn" title="Switch to edit mode">
      <i class="fas fa-pencil-alt"></i>
    </div>

    <div id="tooltip"></div>

    <!-- Кнопка Домой слева внизу -->
    <a href="index.html" class="btn" style="position: absolute; bottom: 16px; left: 16px; background: #388bfd; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; z-index: 10; font-size: 1.1rem;">
      <i class="fas fa-home"></i> Home
    </a>

    <!-- Статистика справа внизу -->
    <button id="stats-btn" class="btn" style="position: absolute; bottom: 16px; right: 16px; z-index: 10;">
      <i class="fas fa-chart-line"></i> Statistics
    </button>
  </div>

  <!-- password-overlay и stats-overlay без изменений -->

  <script>
    const firebaseConfig = {
      // ... (твоя конфигурация Firebase)
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const stateRef = db.ref('circles/five_stones/global'); // ← для Five Stones

    // Весь остальной скрипт — копируй из твоего текущего five_stones_progress.html
    // (createCircle, handleCircleClick, pan, wheel, saveSharedState и т.д.)

    // Только убедитесь, что в updateModeUI кнопки addMode и bgUpload показываются
    function updateModeUI() {
      toolbar.style.display = 'flex';

      if (mode === 'edit') {
        modeBtn.innerHTML = '<i class="fas fa-eye"></i>';
        modeBtn.title = 'Switch to view mode';
        document.getElementById('info').textContent =
          "Edit mode: Left click on pile → install / uninstall · Right click → delete · Wheel zoom · Middle click pan";
        document.getElementById('radius-label').style.display = 'inline';
        radiusInput.style.display = 'inline';
        document.getElementById('total-label').style.display = 'inline';
        totalInput.style.display = 'inline';
        addModeBtn.style.display = 'inline-flex';
        bgUpload.previousElementSibling.style.display = 'inline-flex';
        statsBtn.style.display = 'none';
      } else {
        mode = 'view';
        modeBtn.innerHTML = '<i class="fas fa-pencil-alt"></i>';
        modeBtn.title = 'Switch to edit mode';
        tooltip.style.opacity = '0';
        document.getElementById('info').textContent =
          "View mode only · Wheel zoom · Left click drag to pan when zoomed · Hover on installed pile to see date";
        document.getElementById('radius-label').style.display = 'none';
        radiusInput.style.display = 'none';
        document.getElementById('total-label').style.display = 'none';
        totalInput.style.display = 'none';
        addModeBtn.style.display = 'none';
        bgUpload.previousElementSibling.style.display = 'none';
        statsBtn.style.display = 'inline-flex';
      }
    }

    // ... (весь остальной скрипт как в твоём файле) ...
  </script>
</body>
</html>
